<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이드 프로젝트 계획부터 실행까지 Obsidian으로 A to Z</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        /* 메인 컨테이너 */
        .presentation-container {
            display: flex;
            height: 100vh;
            gap: 0;
        }

        /* 좌측 목차 패널 */
        .sidebar {
            width: 280px;
            background: rgba(26, 26, 46, 0.95);
            overflow-y: auto;
            padding: 20px 0;
            border-right: 2px solid rgba(255, 140, 0, 0.3);
            transition: all 0.3s ease;
        }

        .sidebar.collapsed {
            width: 0;
            padding: 0;
            border: none;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 15px 20px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.2), rgba(0, 150, 200, 0.2));
            margin-bottom: 10px;
        }

        .slide-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
            font-size: 13px;
        }

        .slide-item:hover {
            background: rgba(255, 140, 0, 0.1);
            color: #fff;
        }

        .slide-item.active {
            background: linear-gradient(90deg, rgba(255, 140, 0, 0.3), transparent);
            border-left-color: #ff8c00;
            color: #fff;
            font-weight: 600;
        }

        /* 메인 슬라이드 영역 */
        .slides-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .slides-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 60px;
            opacity: 0;
            transform: translateX(100px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .slide.prev {
            transform: translateX(-100px);
        }

        /* 슬라이드 배경 그래디언트 */
        .slide {
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
        }

        .slide.title-slide {
            background: linear-gradient(135deg, #ff8c00 0%, #ffa500 30%, #0096c8 100%);
            color: white;
        }

        .slide.section-slide {
            background: linear-gradient(135deg, #fff8f0 0%, #e8f4f8 100%);
        }

        .slide.highlight-slide {
            background: linear-gradient(135deg, #ffd700 0%, #ffa500 50%, #ff6b6b 100%);
            color: white;
        }

        .slide.end-slide {
            background: linear-gradient(135deg, #6366f1 0%, #0096c8 100%);
            color: white;
        }

        /* 슬라이드 콘텐츠 */
        .slide-content {
            text-align: center;
            max-width: 900px;
            width: 100%;
            z-index: 10;
        }

        .slide.title-slide .slide-content {
            text-align: center;
        }

        .slide.content-slide .slide-content {
            text-align: left;
        }

        .slide-content h1 {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .slide.title-slide h1 {
            font-size: 60px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
        }

        .slide-content h2 {
            font-size: 44px;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.2;
        }

        .slide.title-slide h2 {
            font-size: 28px;
            font-weight: 300;
            opacity: 0.9;
            margin-top: 15px;
        }

        .slide-content h3 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 25px;
            margin-top: 0;
        }

        .slide-content p {
            font-size: 22px;
            line-height: 1.7;
            margin-bottom: 20px;
            opacity: 0.85;
        }

        .slide.title-slide p {
            font-size: 20px;
            opacity: 0.9;
        }

        .slide-content ul {
            list-style: none;
            text-align: left;
            margin: 30px 0;
            font-size: 22px;
            line-height: 1.8;
        }

        .slide-content li {
            margin-bottom: 20px;
            padding-left: 40px;
            position: relative;
        }

        .slide-content li:before {
            content: "▶";
            position: absolute;
            left: 0;
            color: #ff8c00;
            font-size: 18px;
        }

        .highlight-box {
            background: rgba(255, 140, 0, 0.15);
            border-left: 4px solid #ff8c00;
            padding: 20px 25px;
            margin: 25px 0;
            border-radius: 4px;
            font-size: 20px;
            line-height: 1.6;
        }

        .slide.title-slide .highlight-box {
            background: rgba(255, 255, 255, 0.2);
            border-left-color: rgba(255, 255, 255, 0.8);
            color: white;
        }

        .meta-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 40px;
            font-size: 18px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .meta-item strong {
            color: #ff8c00;
            min-width: 80px;
        }

        .slide.title-slide .meta-item strong {
            color: rgba(255, 255, 255, 0.9);
        }

        /* 타이틀 슬라이드 구분선 */
        .divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #ff8c00, #0096c8);
            margin: 25px auto;
            border-radius: 2px;
        }

        .slide.title-slide .divider {
            background: rgba(255, 255, 255, 0.5);
        }

        /* 네비게이션 바 */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(255, 140, 0, 0.3);
            z-index: 100;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        button {
            background: linear-gradient(135deg, #ff8c00, #ffa500);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 140, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: rgba(255, 140, 0, 0.2);
            border: 1px solid #ff8c00;
            color: #ff8c00;
        }

        button.secondary:hover {
            background: rgba(255, 140, 0, 0.3);
            box-shadow: 0 6px 16px rgba(255, 140, 0, 0.2);
        }

        .progress-info {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #fff;
        }

        .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff8c00, #0096c8);
            width: 0%;
            transition: width 0.3s ease;
        }

        .slide-counter {
            color: #ff8c00;
            font-weight: 600;
            min-width: 60px;
            text-align: right;
        }

        /* 강사 노트 */
        .speaker-notes {
            max-height: 0;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 0 40px;
            transition: max-height 0.3s ease;
            border-bottom: 1px solid rgba(255, 140, 0, 0.2);
        }

        .speaker-notes.show {
            max-height: 150px;
            padding: 20px 40px;
        }

        .speaker-notes h4 {
            color: #ff8c00;
            margin-bottom: 10px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .speaker-notes p {
            font-size: 14px;
            line-height: 1.5;
            margin: 5px 0;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 토글 버튼 */
        .toggle-sidebar {
            position: absolute;
            left: 0;
            top: 20px;
            z-index: 150;
            background: rgba(255, 140, 0, 0.2) !important;
            border: 1px solid #ff8c00 !important;
            padding: 8px 12px !important;
            color: #ff8c00 !important;
        }

        /* 반응형 */
        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }

            .slide {
                padding: 60px 40px;
            }

            .slide-content h1 {
                font-size: 44px;
            }

            .slide-content h2 {
                font-size: 36px;
            }

            .slide-content p,
            .slide-content ul {
                font-size: 18px;
            }
        }

        @media (max-width: 768px) {
            .presentation-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 120px;
                border-right: none;
                border-bottom: 2px solid rgba(255, 140, 0, 0.3);
                display: flex;
                overflow-x: auto;
            }

            .sidebar-header {
                min-width: 200px;
            }

            .slide {
                padding: 40px 25px;
            }

            .controls {
                flex-direction: column;
                gap: 15px;
            }

            .slide-content h1 {
                font-size: 32px;
            }

            .slide-content h2 {
                font-size: 28px;
            }

            .slide-content h3 {
                font-size: 24px;
            }

            .slide-content p,
            .slide-content ul {
                font-size: 16px;
            }
        }

        /* 전체 화면 모드 */
        .presentation-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
        }

        .sidebar.hide-on-fullscreen {
            display: none;
        }

        /* 프린트 스타일 */
        @media print {
            body {
                background: white;
            }

            .sidebar,
            .controls {
                display: none;
            }

            .slide {
                page-break-after: always;
                position: static;
                opacity: 1;
                transform: none;
            }
        }

        /* 스크린 리더 */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>
    <div class="presentation-container" id="presentationContainer">
        <!-- 좌측 목차 패널 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">슬라이드</div>
            <div id="slideList"></div>
        </div>

        <!-- 메인 슬라이드 영역 -->
        <div class="slides-wrapper">
            <div class="slides-container" id="slidesContainer">
                <!-- 슬라이드는 JavaScript로 동적 생성 -->
            </div>

            <!-- 강사 노트 -->
            <div class="speaker-notes" id="speakerNotes">
                <h4>강사 노트</h4>
                <p id="notesContent"></p>
            </div>

            <!-- 네비게이션 및 컨트롤 -->
            <div class="controls">
                <div class="nav-buttons">
                    <button class="toggle-sidebar" id="toggleSidebar">≡</button>
                    <button id="prevBtn">← 이전</button>
                    <button id="nextBtn">다음 →</button>
                    <button class="secondary" id="fullscreenBtn">전체 화면</button>
                    <button class="secondary" id="notesBtn">노트 보기</button>
                </div>
                <div class="progress-info">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="slide-counter">
                        <span id="currentSlide">1</span> / <span id="totalSlides">1</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 슬라이드 데이터
        const slides = [
            {
                type: 'title',
                title: '사이드 프로젝트 계획부터 실행까지',
                subtitle: 'Obsidian으로 A to Z',
                description: '아이디어는 많은데, 어디서부터 시작해야 할지 모르겠어요? 이제 Obsidian과 함께라면 흩어진 아이디어를 체계적으로 정리하고, 사이드 프로젝트를 성공적으로 실행할 수 있습니다.',
                meta: [
                    { label: '강의 날짜', value: '11월 05일, 20:00 - 21:00' },
                    { label: '장소', value: '온라인 (Zoom)' }
                ],
                notes: '강의 시작 전에 기술 점검을 하고, 참여자들을 따뜻하게 환영하세요.'
            },
            {
                type: 'section',
                title: '연사 소개',
                subtitle: '진여진',
                content: [
                    '지피터스 16기부터 지금까지 다양한 활동을 지속',
                    '현재 프리랜서 개발자로 활약 중'
                ],
                notes: '연사의 배경과 경험에 대해 자세히 설명하고, 청중들과의 연결을 만들어보세요.'
            },
            {
                type: 'section',
                title: '1부: 아이디어 정리',
                subtitle: '흩어진 아이디어를 체계화하기',
                content: [
                    '흩어진 아이디어를 Obsidian으로 체계화하기',
                    '프로젝트의 큰 그림 그리기',
                    '아이디어 관리의 핵심 원칙 이해'
                ],
                notes: 'Obsidian의 기본 기능을 소개하고, 실제 예시를 보여주면서 참여자들의 이해도를 높이세요.'
            },
            {
                type: 'section',
                title: '2부: 계획 수립',
                subtitle: 'AI와 함께하는 워크플로우 구축',
                content: [
                    'AI와 함께하는 워크플로우 구축',
                    '프로젝트 계획의 A to Z',
                    '효율적인 프로젝트 구조 설계'
                ],
                notes: 'AI 도구들을 어떻게 Obsidian과 통합할 수 있는지 보여주세요. 실제 워크플로우 예시가 중요합니다.'
            },
            {
                type: 'section',
                title: '3부: 실행 전략',
                subtitle: 'Obsidian을 활용한 실전 사례',
                content: [
                    'Obsidian을 활용한 실전 사례',
                    '끊김 없는 프로젝트 진행 팁',
                    '프로젝트 추적 및 모니터링 방법'
                ],
                notes: '성공한 사이드 프로젝트 사례를 공유하고, 실패의 경험에서 배운 점들을 이야기하세요.'
            },
            {
                type: 'section',
                title: '4부: 질의응답',
                subtitle: '실전 팁 공유 및 맞춤형 해결방안',
                content: [
                    '실전 팁 공유',
                    '참가자 맞춤형 해결방안 제시',
                    '네트워킹 및 피드백 수집'
                ],
                notes: '참여자들의 질문에 충분한 시간을 할애하고, 각각의 상황에 맞는 조언을 해주세요.'
            },
            {
                type: 'highlight',
                title: '핵심 메시지',
                content: '사이드 프로젝트의 시작과 끝을\n완벽하게 마스터하세요!',
                notes: '강의의 핵심 메시지를 강조하면서 참여자들의 동기를 부여하세요.'
            },
            {
                type: 'end',
                title: '감사합니다!',
                content: '지금 신청하세요',
                subtitle: '질문이 있으신가요?',
                notes: '강의를 마무리하면서 참여해주신 분들께 감사의 마음을 전하고, 추가 리소스나 연락처를 공유하세요.'
            }
        ];

        // 전역 변수
        let currentSlideIndex = 0;

        // 슬라이드 HTML 생성
        function createSlideElement(slide, index) {
            const div = document.createElement('div');
            div.className = `slide ${slide.type}-slide`;
            div.id = `slide-${index}`;
            div.setAttribute('data-notes', slide.notes || '');

            let html = '<div class="slide-content">';

            if (slide.type === 'title') {
                html += `
                    <h1>${slide.title}</h1>
                    <div class="divider"></div>
                    <h2>${slide.subtitle}</h2>
                    <p style="margin-top: 40px; font-size: 20px;">${slide.description}</p>
                `;
                if (slide.meta) {
                    html += '<div class="meta-info">';
                    slide.meta.forEach(item => {
                        html += `
                            <div class="meta-item">
                                <strong>${item.label}:</strong>
                                <span>${item.value}</span>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
            } else if (slide.type === 'section') {
                html += `
                    <h2>${slide.title}</h2>
                    <div class="divider"></div>
                    <h3>${slide.subtitle}</h3>
                    <ul style="margin-top: 40px;">
                `;
                slide.content.forEach(item => {
                    html += `<li>${item}</li>`;
                });
                html += '</ul>';
            } else if (slide.type === 'highlight') {
                html += `
                    <h2>${slide.title}</h2>
                    <div class="divider" style="margin: 40px auto;"></div>
                    <div class="highlight-box" style="background: rgba(255, 255, 255, 0.2); border-color: white; font-size: 32px; color: white; font-weight: 600;">
                        ${slide.content}
                    </div>
                `;
            } else if (slide.type === 'end') {
                html += `
                    <h1>${slide.title}</h1>
                    <div class="divider"></div>
                    <h3 style="font-size: 28px; margin-top: 40px;">${slide.subtitle}</h3>
                    <p style="margin-top: 40px; font-size: 24px;">${slide.content}</p>
                `;
            }

            html += '</div>';
            div.innerHTML = html;
            return div;
        }

        // 슬라이드 목록 생성
        function createSlideList() {
            const slideList = document.getElementById('slideList');
            slideList.innerHTML = '';

            slides.forEach((slide, index) => {
                const item = document.createElement('div');
                item.className = 'slide-item';

                let title = '';
                if (slide.type === 'title') {
                    title = `제목: ${slide.title}`;
                } else if (slide.type === 'section') {
                    title = `${index}부: ${slide.title}`;
                } else if (slide.type === 'highlight') {
                    title = `강조: ${slide.title}`;
                } else if (slide.type === 'end') {
                    title = `종료: ${slide.title}`;
                }

                item.textContent = title;
                item.onclick = () => goToSlide(index);
                slideList.appendChild(item);
            });
        }

        // 슬라이드 렌더링
        function renderSlides() {
            const container = document.getElementById('slidesContainer');
            container.innerHTML = '';
            slides.forEach((slide, index) => {
                container.appendChild(createSlideElement(slide, index));
            });
            document.getElementById('totalSlides').textContent = slides.length;
        }

        // 현재 슬라이드로 이동
        function goToSlide(index) {
            if (index < 0 || index >= slides.length) return;

            // 모든 슬라이드 비활성화
            document.querySelectorAll('.slide').forEach(slide => {
                slide.classList.remove('active', 'prev');
            });

            // 현재 슬라이드 활성화
            const currentSlide = document.getElementById(`slide-${index}`);
            currentSlide.classList.add('active');

            // 이전 슬라이드 표시 (애니메이션용)
            if (index > 0) {
                document.getElementById(`slide-${index - 1}`).classList.add('prev');
            }

            currentSlideIndex = index;

            // UI 업데이트
            updateUI();
        }

        // UI 업데이트
        function updateUI() {
            // 슬라이드 카운터
            document.getElementById('currentSlide').textContent = currentSlideIndex + 1;

            // 프로그래스 바
            const progress = ((currentSlideIndex + 1) / slides.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // 목차 활성화 상태
            document.querySelectorAll('.slide-item').forEach((item, index) => {
                item.classList.toggle('active', index === currentSlideIndex);
            });

            // 강사 노트 업데이트
            const currentSlide = slides[currentSlideIndex];
            const notesContent = document.getElementById('notesContent');
            if (currentSlide.notes) {
                notesContent.textContent = currentSlide.notes;
            } else {
                notesContent.textContent = '이 슬라이드에 대한 노트가 없습니다.';
            }

            // 이전/다음 버튼 활성화 상태
            document.getElementById('prevBtn').disabled = currentSlideIndex === 0;
            document.getElementById('nextBtn').disabled = currentSlideIndex === slides.length - 1;
        }

        // 네비게이션 함수
        function nextSlide() {
            goToSlide(currentSlideIndex + 1);
        }

        function prevSlide() {
            goToSlide(currentSlideIndex - 1);
        }

        // 전체 화면
        function toggleFullscreen() {
            const container = document.getElementById('presentationContainer');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.error(`전체 화면 요청 실패: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // 노트 토글
        function toggleNotes() {
            const notes = document.getElementById('speakerNotes');
            notes.classList.toggle('show');
        }

        // 사이드바 토글
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        // 이벤트 리스너
        document.getElementById('nextBtn').addEventListener('click', nextSlide);
        document.getElementById('prevBtn').addEventListener('click', prevSlide);
        document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
        document.getElementById('notesBtn').addEventListener('click', toggleNotes);
        document.getElementById('toggleSidebar').addEventListener('click', toggleSidebar);

        // 키보드 네비게이션
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'Home') {
                goToSlide(0);
            } else if (e.key === 'End') {
                goToSlide(slides.length - 1);
            } else if (e.key === 'n' || e.key === 'N') {
                toggleNotes();
            }
        });

        // 터치 제스처
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });

        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            if (touchStartX - touchEndX > 50) {
                nextSlide(); // 왼쪽 스와이프
            } else if (touchEndX - touchStartX > 50) {
                prevSlide(); // 오른쪽 스와이프
            }
        });

        // 초기화
        function initialize() {
            renderSlides();
            createSlideList();
            goToSlide(0);
        }

        // 페이지 로드 시 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
    </script>
</body>
</html>
